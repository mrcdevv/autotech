<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: layout(~{::content})}" lang="es">
<body>
<th:block th:fragment="content">
    <div th:replace="~{email/components :: chip('Turno reprogramado', 'info')}"></div>
    <div th:replace="~{email/components :: heading('Tu turno cambió de fecha')}"></div>
    <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#4E545E;">Hola <span th:text="${name}">Martín</span>, reprogramamos el turno<th:block th:if="${vehicle != null}"> de tu <span th:text="${vehicle}">Toyota Corolla (AB 123 CD)</span></th:block>. Estos son los datos nuevos:</p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px 0;">
        <tr>
            <td width="50%" valign="top" style="padding-right:6px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FBFAF7;border:1px solid #ECE9E1;border-radius:8px;border-collapse:separate;">
                    <tr><td style="padding:16px 16px 6px 16px;font-size:12px;font-weight:600;color:#646A75;text-transform:uppercase;letter-spacing:0.05em;">Antes</td></tr>
                    <tr><td style="padding:0 16px 4px 16px;font-size:15px;color:#646A75;text-decoration:line-through;" th:text="${oldDate}">Jueves 23/10</td></tr>
                    <tr><td style="padding:0 16px 16px 16px;font-size:15px;color:#646A75;text-decoration:line-through;" th:text="${oldTime}">09:00 a 10:00</td></tr>
                </table>
            </td>
            <td width="50%" valign="top" style="padding-left:6px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FFFFFF;border:1px solid #FF7A1A;border-radius:8px;border-collapse:separate;">
                    <tr><td style="padding:16px 16px 6px 16px;font-size:12px;font-weight:600;color:#B4560F;text-transform:uppercase;letter-spacing:0.05em;">Ahora</td></tr>
                    <tr><td style="padding:0 16px 4px 16px;font-size:15px;font-weight:700;color:#1D1F24;" th:text="${newDate}">Viernes 24/10</td></tr>
                    <tr><td style="padding:0 16px 16px 16px;font-size:15px;font-weight:700;color:#1D1F24;" th:text="${newTime}">11:00 a 12:00</td></tr>
                </table>
            </td>
        </tr>
    </table>
    <p th:if="${purpose != null}" style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#4E545E;">El motivo del turno sigue siendo el mismo: <b style="color:#1D1F24;" th:text="${purpose}">Service de 20.000 km</b>.</p>
    <div th:replace="~{email/components :: buttons('Confirmar nuevo horario', ${confirmUrl}, 'No me sirve', ${declineUrl})}"></div>
</th:block>
</body>
</html>
