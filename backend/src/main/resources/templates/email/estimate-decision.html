<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: layout(~{::content})}" lang="es">
<body>
<th:block th:fragment="content">
    <div th:replace="~{email/components :: chip(${chipLabel}, ${chipTone})}"></div>
    <div th:replace="~{email/components :: heading('Presupuesto ' + ${estimateNumber} + ' ' + ${statusLabel})}"></div>
    <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#4E545E;">El presupuesto de <b style="color:#1D1F24;" th:text="${clientName}">Martín Gómez</b> fue marcado como <b style="color:#1D1F24;" th:text="${statusLabel}">aprobado</b>.</p>
    <div th:replace="~{email/components :: details(${rows})}"></div>
    <div th:replace="~{email/components :: buttons('Ver presupuesto', ${detailUrl}, null, null)}"></div>
</th:block>
</body>
</html>
