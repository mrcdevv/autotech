<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: layout(~{::content})}" lang="es">
<body>
<th:block th:fragment="content">
    <div th:replace="~{email/components :: chip('Pendiente de retiro', 'parts')}"></div>
    <div th:replace="~{email/components :: heading('Tu vehículo sigue en el taller')}"></div>
    <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#4E545E;">Hola <span th:text="${name}">Martín</span>, tu <span th:text="${vehicle}">Toyota Corolla (AB 123 CD)</span> está listo desde hace <b style="color:#1D1F24;"><span th:text="${days}">5</span> <span th:text="${daysLabel}">días</span></b> y todavía no lo retiraste.</p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="margin:0 0 20px 0;background:#FBFAF7;border:1px solid #ECE9E1;border-radius:8px;border-collapse:separate;">
        <tr>
            <td width="84" style="width:84px;padding:18px;">
                <table role="presentation" width="84" cellpadding="0" cellspacing="0" border="0" style="width:84px;height:84px;background:#FBE7D2;border-radius:42px;border-collapse:separate;text-align:center;">
                    <tr><td style="font-size:28px;font-weight:700;color:#8A4B12;line-height:1;padding-top:18px;" th:text="${days}">5</td></tr>
                    <tr><td style="font-size:11px;font-weight:600;color:#8A4B12;padding-bottom:18px;" th:text="${daysLabel}">días</td></tr>
                </table>
            </td>
            <td style="padding:18px 18px 18px 0;font-size:14px;line-height:1.9;color:#1D1F24;">
                <span style="color:#646A75;">Listo desde:</span> <b th:text="${readySince}">Sábado 11/10</b><br>
                <span style="color:#646A75;">Orden de trabajo:</span> <b th:text="${orderNumber}">#1042</b>
            </td>
        </tr>
    </table>
    <p style="margin:0 0 20px 0;font-size:14px;line-height:1.6;color:#4E545E;">Si no podés pasar en estos días, avisanos y coordinamos el retiro.</p>
    <div th:replace="~{email/components :: buttons('Ver cómo llegar', ${workshopMapsUrl != null and !#strings.isEmpty(workshopMapsUrl) ? workshopMapsUrl : null}, 'Coordinar retiro', ${workshopContactUrl != null and !#strings.isEmpty(workshopContactUrl) ? workshopContactUrl : null})}"></div>
</th:block>
</body>
</html>
