<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: layout(~{::content})}" lang="es">
<body>
<th:block th:fragment="content">
    <div th:replace="~{email/components :: heading('Tu contraseña fue restablecida')}"></div>
    <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#4E545E;">Hola <span th:text="${name}">Lucía</span>, un administrador generó una contraseña temporal para tu cuenta <b style="color:#1D1F24;" th:text="${email}">lucia@taller.com</b>.</p>
    <div th:replace="~{email/components :: details(${rows})}"></div>
    <div th:replace="~{email/components :: note('Por seguridad, el sistema te va a pedir que la cambies en el próximo ingreso.', 'warn')}"></div>
    <div th:replace="~{email/components :: buttons('Ingresar al sistema', ${loginUrl}, null, null)}"></div>
    <p style="margin:0 0 20px 0;font-size:13px;line-height:1.6;color:#646A75;">Si no esperabas este cambio, avisale al administrador del taller.</p>
</th:block>
</body>
</html>
