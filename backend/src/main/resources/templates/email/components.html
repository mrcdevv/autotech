<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>

<!-- Status chip -->
<table th:fragment="chip(label, tone)" role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px 0;">
    <tr>
        <td th:style="|background:${tones.get(tone).get('bg')};color:${tones.get(tone).get('fg')};padding:3px 10px;border-radius:4px;font-size:12px;font-weight:600;|"
            th:text="${label}">Estado</td>
    </tr>
</table>

<!-- Main heading -->
<h1 th:fragment="heading(text)" style="margin:0 0 20px 0;font-size:22px;font-weight:650;letter-spacing:-0.01em;color:#1D1F24;" th:text="${text}">Título</h1>

<!-- Label / value table -->
<table th:fragment="details(rows)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:0 0 20px 0;background:#FBFAF7;border:1px solid #ECE9E1;border-radius:8px;border-collapse:separate;">
    <tr th:each="row, it : ${rows}">
        <td th:style="|padding:11px 18px;font-size:14px;color:#646A75;${it.last ? '' : 'border-bottom:1px solid #ECE9E1;'}|" th:text="${row.label()}">Etiqueta</td>
        <td align="right" th:style="|padding:11px 18px;font-size:14px;font-weight:600;color:#1D1F24;${it.last ? '' : 'border-bottom:1px solid #ECE9E1;'}|" th:text="${row.value()}">Valor</td>
    </tr>
</table>

<!-- Items with amounts and a total line -->
<table th:fragment="items(rows, totalLabel, total)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:0 0 20px 0;border:1px solid #ECE9E1;border-radius:8px;border-collapse:separate;">
    <tr>
        <td style="padding:10px 16px;background:#EFEDE6;font-size:12px;font-weight:600;color:#4E545E;text-transform:uppercase;letter-spacing:0.05em;border-radius:8px 0 0 0;">Detalle</td>
        <td align="right" style="padding:10px 16px;background:#EFEDE6;font-size:12px;font-weight:600;color:#4E545E;text-transform:uppercase;letter-spacing:0.05em;border-radius:0 8px 0 0;">Importe</td>
    </tr>
    <tr th:each="row : ${rows}">
        <td style="padding:11px 16px;border-bottom:1px solid #ECE9E1;font-size:14px;color:#1D1F24;" th:text="${row.label()}">Servicio</td>
        <td align="right" style="padding:11px 16px;border-bottom:1px solid #ECE9E1;font-size:14px;color:#1D1F24;white-space:nowrap;" th:text="${row.value()}">$ 0,00</td>
    </tr>
    <tr>
        <td style="padding:13px 16px;background:#FBFAF7;font-size:16px;font-weight:700;border-radius:0 0 0 8px;" th:text="${totalLabel}">Total</td>
        <td align="right" style="padding:13px 16px;background:#FBFAF7;font-size:16px;font-weight:700;white-space:nowrap;border-radius:0 0 8px 0;" th:text="${total}">$ 0,00</td>
    </tr>
</table>

<!-- Primary button (orange) and optional secondary button (outlined) -->
<table th:fragment="buttons(primaryLabel, primaryUrl, secondaryLabel, secondaryUrl)" role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px 0;">
    <tr>
        <td th:if="${primaryUrl != null}" style="background:#FF7A1A;border-radius:4px;">
            <a th:href="${primaryUrl}" style="display:inline-block;padding:13px 24px;color:#17181C;font-weight:600;font-size:15px;text-decoration:none;" th:text="${primaryLabel}">Acción</a>
        </td>
        <td th:if="${primaryUrl != null and secondaryUrl != null}" style="width:12px;">&nbsp;</td>
        <td th:if="${secondaryUrl != null}" style="background:#FFFFFF;border:1px solid #D3CFC4;border-radius:4px;">
            <a th:href="${secondaryUrl}" style="display:inline-block;padding:12px 22px;color:#1D1F24;font-weight:600;font-size:15px;text-decoration:none;" th:text="${secondaryLabel}">Otra acción</a>
        </td>
    </tr>
</table>

<!-- Colored note box -->
<table th:fragment="note(text, tone)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px 0;">
    <tr>
        <td th:style="|background:${tones.get(tone).get('bg')};color:${tones.get(tone).get('fg')};border-radius:4px;padding:12px 14px;font-size:13px;line-height:1.5;|" th:text="${text}">Nota</td>
    </tr>
</table>

<!-- Raw link for clients where buttons do not work -->
<div th:fragment="linkFallback(url)" style="margin:0 0 20px 0;border-top:1px solid #ECE9E1;padding-top:16px;font-size:12px;line-height:1.6;color:#646A75;">
    ¿El botón no funciona? Copiá este enlace en el navegador:<br>
    <span style="font-family:'JetBrains Mono',Consolas,monospace;color:#4E545E;word-break:break-all;" th:text="${url}">https://</span>
</div>

</body>
</html>
