<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: layout(~{::content})}" lang="es">
<body>
<th:block th:fragment="content">
    <div th:replace="~{email/components :: heading('¡Bienvenido/a a ' + ${workshopName} + '!')}"></div>
    <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#4E545E;">Hola <span th:text="${name}">Lucía</span>, creamos tu cuenta en el sistema del taller.</p>
    <div th:replace="~{email/components :: details(${rows})}"></div>
    <div th:replace="~{email/components :: note('Por seguridad, el sistema te va a pedir que cambies la contraseña en el primer ingreso.', 'warn')}"></div>
    <div th:replace="~{email/components :: buttons('Ingresar al sistema', ${loginUrl}, null, null)}"></div>
</th:block>
</body>
</html>
