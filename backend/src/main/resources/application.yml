spring:
  application:
    name: autotech-backend
  profiles:
    active: dev

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

autotech:
  mail:
    enabled: ${AUTOTECH_MAIL_ENABLED:false}
    from: ${AUTOTECH_MAIL_FROM:no-reply@autotech.com}
    workshop-name: ${AUTOTECH_WORKSHOP_NAME:Autotech}
    workshop-address: ${AUTOTECH_WORKSHOP_ADDRESS:}
    workshop-phone: ${AUTOTECH_WORKSHOP_PHONE:}
    workshop-maps-url: ${AUTOTECH_WORKSHOP_MAPS_URL:}
    workshop-contact-url: ${AUTOTECH_WORKSHOP_CONTACT_URL:}
  app:
    public-url: ${AUTOTECH_PUBLIC_URL:http://localhost:3000}
    time-zone: ${AUTOTECH_TIME_ZONE:America/Argentina/Cordoba}
  notifications:
    reminders-cron: ${AUTOTECH_REMINDERS_CRON:0 0 9 * * *}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
