spring:
  application:
    name: autotech-backend
  profiles:
    active: dev

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

autotech:
  mail:
    enabled: ${AUTOTECH_MAIL_ENABLED:false}
    from: ${AUTOTECH_MAIL_FROM:no-reply@autotech.com}
    workshop-name: ${AUTOTECH_WORKSHOP_NAME:Autotech}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
