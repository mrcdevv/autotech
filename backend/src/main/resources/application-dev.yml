spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/autotech
    username: autotech
    password: autotech
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

logging:
  level:
    com.autotech: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

autotech:
  mail:
    # Mailpit (docker compose up mailpit) captures every email locally: http://localhost:8025
    enabled: ${AUTOTECH_MAIL_ENABLED:true}
